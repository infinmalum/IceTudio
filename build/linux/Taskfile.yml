version: '3'
tasks:
  build:
    cmds: ['npm --prefix frontend run build', 'go build -o bin/icetudio .']
  build:native:
    cmds: [{task: build}]
  run:
    cmds: ['node scripts/dev.mjs']
  package:
    cmds: [{task: build}, 'python3 scripts/package.py --os linux --binary bin/icetudio']
  create:appimage:
    cmds: [{task: build}, 'APP_NAME=icetudio APP_BINARY=bin/icetudio ICON_PATH=build/appicon.png DESKTOP_FILE=build/linux/icetudio.desktop bash build/linux/appimage/build.sh']
  create:deb:
    cmds: [{task: build}, {task: generate:deb}]
  create:rpm:
    cmds: [{task: build}, {task: generate:rpm}]
  create:aur:
    cmds: [{task: build}, {task: generate:aur}]
  generate:deb:
    cmds: ['nfpm package --packager deb --config build/linux/nfpm/nfpm.yaml --target bin/']
  generate:rpm:
    cmds: ['nfpm package --packager rpm --config build/linux/nfpm/nfpm.yaml --target bin/']
  generate:aur:
    cmds: ['nfpm package --packager archlinux --config build/linux/nfpm/nfpm.yaml --target bin/']
  sign:deb:
    cmds: ['debsigs --sign=origin bin/*.deb']
  sign:rpm:
    cmds: ['rpmsign --addsign bin/*.rpm']
  sign:packages:
    cmds: [{task: sign:deb}, {task: sign:rpm}]
  build:plugins:
    desc: Build Linux plugin helpers from existing CLAP and VST3 SDK checkouts
    requires:
      vars: [ICETUDIO_CLAP_SDK, ICETUDIO_VST3_SDK]
    cmds:
      - cmake -S internal/pluginhost/native -B bin/plugin-host-build -DCMAKE_BUILD_TYPE=Release -DCLAP_ROOT="{{.ICETUDIO_CLAP_SDK}}" -DVST3_ROOT="{{.ICETUDIO_VST3_SDK}}"
      - cmake --build bin/plugin-host-build --target icetudio-plugin-scan icetudio-plugin-run
      - install -m 755 bin/plugin-host-build/icetudio-plugin-scan bin/plugin-host-build/icetudio-plugin-run bin
  package:plugins:
    desc: Package Linux portable build with both plugin helpers
    cmds:
      - task: build
      - task: build:plugins
      - python3 scripts/package.py --os linux --binary bin/icetudio --plugin-helpers
