# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

name: "icetudio"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
maintainer: ${GIT_COMMITTER_NAME} <${GIT_COMMITTER_EMAIL}>
description: "Local desktop agent"
vendor: "IceTudio"
homepage: "https://wails.io"
license: "AGPL-3.0-only"
release: "1"

contents:
  - src: "./LICENSE"
    dst: "/usr/share/licenses/icetudio/LICENSE"
  - src: "./licenses/"
    dst: "/usr/share/licenses/icetudio/audio/"
  - src: "./assets/soundfonts/NOTICE.md"
    dst: "/usr/share/licenses/icetudio/musescore/NOTICE.md"
  - src: "./assets/soundfonts/MuseScore_General_License.md"
    dst: "/usr/share/licenses/icetudio/musescore/LICENSE.md"
  - src: "./assets/soundfonts/MuseScore_General_Changelog.md"
    dst: "/usr/share/licenses/icetudio/musescore/Changelog.md"
  - src: "./assets/soundfonts/MuseScore_General_Sample_Sources.csv"
    dst: "/usr/share/licenses/icetudio/musescore/Sample_Sources.csv"
  - src: "./assets/soundfonts/MuseScore_General.sf3"
    dst: "/usr/lib/icetudio/MuseScore_General.sf3"
  - src: "./bin/icetudio"
    dst: "/usr/lib/icetudio/icetudio"
  - src: "./build/linux/icetudio-launcher.sh"
    dst: "/usr/local/bin/icetudio"
    file_info:
      mode: 0755
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/icetudio.png"
  - src: "./build/linux/icetudio.desktop"
    dst: "/usr/share/applications/icetudio.desktop"

# GTK4 + WebKitGTK 6.0; FluidSynth 2.6 or newer is required by native.c.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - libfluidsynth3 (>= 2.6.0)

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - libfluidsynth.so.3()(64bit)

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0
      - fluidsynth>=2.6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
#   - libfluidsynth3
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#       - libfluidsynth.so.3()(64bit)
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#       - fluidsynth
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
