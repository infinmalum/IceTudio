version: '3'
tasks:
  build:
    cmds: ['npm --prefix frontend run build', 'go build -o bin/icetudio .']
  build:native:
    cmds: [{task: build}]
  package:
    cmds: [{task: build}, 'python3 scripts/package.py --os darwin --binary bin/icetudio']
  build:universal:
    cmds: ['lipo -create bin/icetudio-amd64 bin/icetudio-arm64 -output bin/icetudio']
  create:dmg:
    cmds: ['hdiutil create -volname IceTudio -srcfolder bin/packages/IceTudio.app -ov -format UDZO bin/IceTudio.dmg']
  codesign:adhoc:
    cmds: ['codesign --force --deep --sign - bin/packages/IceTudio.app']
  sign:
    cmds: ['codesign --force --deep --options runtime --sign "{{.SIGN_IDENTITY}}" bin/packages/IceTudio.app']
  notarize:
    cmds: ['ditto -c -k --keepParent bin/packages/IceTudio.app bin/packages/IceTudio-notary.zip', 'xcrun notarytool submit bin/packages/IceTudio-notary.zip --keychain-profile "{{.NOTARY_PROFILE}}" --wait']
  run:
    cmds: ['node scripts/dev.mjs']
