version: '3'
tasks:
  build:frontend:
    cmds: ['npm --prefix frontend run build']
  install:frontend:deps:
    cmds: ['npm --prefix frontend ci']
  dev:frontend:
    cmds: ['npm --prefix frontend run dev']
  build:server:
    desc: Build the standalone internal IPC host
    cmds: ['go build -o bin/icetudio-server ./cmd/icetudio-server']
  run:server:
    cmds: ['go run ./cmd/icetudio-server']
  build:docker:
    cmds: ['docker build -f build/docker/Dockerfile.server -t icetudio-host .']
  run:docker:
    cmds: ['docker run --rm -v icetudio-data:/var/lib/icetudio icetudio-host']
  setup:docker:
    cmds: ['docker build -f build/docker/Dockerfile.cross -t icetudio-cross .']
