version: '3'
tasks:
  build:
    cmds: ['npm --prefix frontend run build', 'go build -ldflags="-H windowsgui" -o bin/icetudio.exe .']
  build:native:
    cmds: [{task: build}]
  package:
    cmds: [{task: build}, 'python scripts/package.py --os windows --binary bin/icetudio.exe']
  create:nsis:installer:
    cmds: ['makensis build/windows/nsis/project.nsi']
  create:msix:package:
    cmds: ['powershell -NoProfile -File build/windows/package-msix.ps1']
  run:
    cmds: ['node scripts/dev.mjs']
  sign:
    cmds: ['signtool sign /a /fd SHA256 bin/icetudio.exe']
  sign:installer:
    cmds: ['signtool sign /a /fd SHA256 bin/icetudio-installer.exe']
