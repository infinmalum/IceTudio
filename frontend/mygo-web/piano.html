<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-src 'none'; object-src 'none'">
<script>window.addEventListener("error",event=>{document.documentElement.dataset.loadError=JSON.stringify({message:event.message||"resource failed",source:event.filename||event.target?.src,line:event.lineno,column:event.colno,stack:event.error?.stack})},true);window.addEventListener("unhandledrejection",event=>{document.documentElement.dataset.loadError=String(event.reason)});</script>
<link rel="stylesheet" href="/mygo-web/assets/piano.css"><title>Piano Roll</title></head>
<body><div id="root"></div><script type="module" src="/mygo-web/assets/piano.js"></script></body></html>
