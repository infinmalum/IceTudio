# 基础 CI（工程化与安全基线，2026-10-23 纳入）：go test/vet、前端生产构建、
# 音乐规则、Native 控件和实际 MyGo/WebKit（Xvfb）回归。
# 依赖真实音频设备或桌面环境的验收（物理延迟、原生窗口、真实 MyGo 交互）
# 不在此伪装为通过，见 docs/mygo-acceptance.md。
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装系统依赖（GTK3/WebKitGTK 开发包 + 源码编译 FluidSynth 2.6.1）
        # MyGo uses GTK3/WebKitGTK 4.1 at runtime; core audio still uses cgo.
        # Ubuntu 仓库的 FluidSynth 缺 2.6 portamento time-mode API，而播放引擎
        # 要求 >= 2.6（native.c 有编译期检查）。测试只用 offline 引擎，无需
        # 音频驱动与 libsndfile，最小化编译即可。
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libglib2.0-dev libasound2-dev ffmpeg \
            libgtk-3-dev libwebkit2gtk-4.1-dev xvfb dbus-x11 python3-gi \
            gir1.2-webkit-6.0 gir1.2-gtk-4.0
          curl -fL https://github.com/FluidSynth/fluidsynth/archive/refs/tags/v2.6.1.tar.gz -o /tmp/fluidsynth.tar.gz
          tar -xf /tmp/fluidsynth.tar.gz -C /tmp
          cmake -S /tmp/fluidsynth-2.6.1 -B /tmp/fluidsynth-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -Denable-alsa=OFF -Denable-pulseaudio=OFF -Denable-jack=OFF -Denable-pipewire=OFF \
            -Denable-oss=OFF -Denable-sdl2=OFF -Denable-portaudio=OFF \
            -Denable-libsndfile=OFF -Denable-dbus=OFF -Denable-readline=OFF \
            -Denable-ladspa=OFF -Denable-openmp=OFF -Denable-libinstpatch=OFF
          cmake --build /tmp/fluidsynth-build --parallel "$(nproc)"
          sudo cmake --install /tmp/fluidsynth-build
          sudo ldconfig
      - name: 前端依赖
        working-directory: frontend
        run: npm ci
      - name: 前端生产构建
        # Go embeds only the isolated Piano Roll assets.
        working-directory: frontend
        run: |
          npm run build
      - name: Go 测试
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: 音乐单元测试（时间图 + GM 元数据）
        working-directory: frontend
        run: npm run test:music
      - name: Product e2e（headless）
        working-directory: frontend
        run: npm run test:ui
      - name: Actual MyGo/WebKit integration (local model fixture)
        env:
          MYGO_GPU: "0"
        run: dbus-run-session -- xvfb-run -a npm --prefix frontend run test:native
