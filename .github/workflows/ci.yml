# 基础 CI（工程化与安全基线，2026-10-23 纳入）：go test/vet、前端生产构建、
# 音乐单元测试与 product/music e2e（headless）。
# 依赖真实音频设备或桌面环境的验收（物理延迟、原生窗口、真实 Wails 交互）
# 不在此伪装为通过，保留为 manual/native acceptance（见 IMPLEMENTATION_PLAN.md）。
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # GitHub 托管 runner 预装 Google Chrome；本地默认 chromium 不变。
      ICETUDIO_E2E_BROWSER: google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装 FluidSynth 2.6.1（源码编译）
        # Ubuntu 仓库的 FluidSynth 缺 2.6 portamento time-mode API，而播放引擎
        # 要求 >= 2.6（native.c 有编译期检查）。测试只用 offline 引擎，无需
        # 音频驱动与 libsndfile，最小化编译即可。
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libglib2.0-dev
          curl -fL https://github.com/FluidSynth/fluidsynth/archive/refs/tags/v2.6.1.tar.gz -o /tmp/fluidsynth.tar.gz
          tar -xf /tmp/fluidsynth.tar.gz -C /tmp
          cmake -S /tmp/fluidsynth-2.6.1 -B /tmp/fluidsynth-build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -Denable-alsa=OFF -Denable-pulseaudio=OFF -Denable-jack=OFF -Denable-pipewire=OFF \
            -Denable-oss=OFF -Denable-sdl2=OFF -Denable-portaudio=OFF \
            -Denable-libsndfile=OFF -Denable-dbus=OFF -Denable-readline=OFF \
            -Denable-ladspa=OFF -Denable-openmp=OFF -Denable-libinstpatch=OFF
          cmake --build /tmp/fluidsynth-build --parallel "$(nproc)"
          sudo cmake --install /tmp/fluidsynth-build
          sudo ldconfig
      - name: 生成 Wails 绑定
        # frontend/bindings 是生成物（gitignore），但前端源码直接 import 它；
        # 本地由 wails3 工具链生成，CI 用同一命令、与 go.mod 相同的版本。
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.12
          "$(go env GOPATH)/bin/wails3" generate bindings -ts -i -d frontend/bindings
      - name: 前端依赖
        working-directory: frontend
        run: npm ci
      - name: 前端生产构建
        # main.go 以 go:embed all:frontend/dist 打包产物，必须先于 Go 步骤生成。
        working-directory: frontend
        run: npm run build
      - name: Go 测试
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: 音乐单元测试（时间图 + GM 元数据）
        working-directory: frontend
        run: npm run test:music
      - name: Product e2e（headless）
        working-directory: frontend
        run: npm run test:ui
